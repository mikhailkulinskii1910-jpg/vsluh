<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' kovyor: data:; style-src 'self' 'unsafe-inline'">
<title>Ковёр — настройки</title>
<style>
  :root {
    --bg: #17161a; --panel: #211f25; --line: #34313a; --text: #ece7de; --muted: #9a948b;
    --accent: #d9b77a; --accent-ink: #1b1710;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
  main { padding: 14px 18px 16px; display: grid; grid-template-columns: 330px 1fr; gap: 12px; align-items: start; }
  h1 { grid-column: 1 / -1; font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .col { display: grid; gap: 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .label { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; }
  .label b { color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .icons { display: grid; gap: 6px; }
  .icons.seven { grid-template-columns: repeat(7, 1fr); }
  .icons.four { grid-template-columns: repeat(4, 1fr); }
  .icons button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: #1a191d; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icons.four button { aspect-ratio: auto; padding: 6px 0 4px; gap: 2px; color: var(--muted); font: 12px "Segoe UI", system-ui, sans-serif; }
  .icons button svg { width: 60%; height: 60%; fill: none; stroke: var(--muted); stroke-width: 2; }
  .icons.four button svg { width: 30px; height: 30px; }
  .icons button[aria-pressed="true"] { border-color: var(--accent); background: #2a251c; color: var(--accent); }
  .icons button[aria-pressed="true"] svg { stroke: var(--accent); fill: rgba(217,183,122,.15); }
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .gallery button { aspect-ratio: 2 / 3; border-radius: 7px; border: 2px solid transparent; padding: 0; cursor: pointer;
                    background: #0d0c0e center / cover no-repeat; position: relative; outline-offset: 1px; }
  .gallery button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,183,122,.25); }
  .gallery button.add { background: #1a191d; border: 1px dashed #4a4650; color: var(--muted); font-size: 12px; display: grid; place-items: center; text-align: center; line-height: 1.2; }
  .gallery button.add span { font-size: 22px; display: block; color: var(--text); }
  .gallery button.add[aria-pressed="true"] { border-style: solid; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  button.btn { border: 1px solid var(--line); background: #2a282e; color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .key { flex: 1; text-align: center; padding: 7px 8px; border-radius: 8px; border: 1px dashed #4a4650; background: #1a191d; cursor: pointer; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .key.wait { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--muted); font-size: 12.5px; }
  .err { color: #e48a7a; font-size: 12.5px; }
  .err:empty { display: none; }
  label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  label.check input { accent-color: var(--accent); width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Настройки ковра</h1>

  <div class="col">
    <section>
      <div class="label">Ковёр <b id="carpetName"></b></div>
      <div class="gallery" id="gallery"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <div class="label">Форма <b id="shapeName"></b></div>
      <div class="icons seven" id="shapes"></div>
    </section>

    <section>
      <div class="label">Размер <b id="widthVal"></b></div>
      <input type="range" id="width" min="140" max="900" step="10">
      <div class="label">Прозрачность <b id="opVal"></b></div>
      <input type="range" id="opacity" min="10" max="100" step="1">
    </section>

    <section>
      <div class="label">Сворачивать в <b id="foldName"></b></div>
      <div class="icons four" id="folds"></div>
      <div class="row">
        <div class="key" id="key" tabindex="0" title="Щёлкните и нажмите сочетание клавиш"></div>
        <button class="btn primary" id="roll">Свернуть / развернуть</button>
      </div>
      <div class="hint">Щёлкните по полю с клавишами и нажмите новое сочетание — оно работает из любой программы.</div>
      <div class="err" id="err"></div>
    </section>

    <section>
      <label class="check"><input type="checkbox" id="onTop"> Поверх всех окон</label>
      <label class="check"><input type="checkbox" id="auto"> Запускать при входе в систему</label>
      <div class="hint">Убрать ковёр — удерживать Esc 3 секунды над ковром.</div>
    </section>
  </div>
</main>
<script src="settings.js"></script>
</body>
</html>
