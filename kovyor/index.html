<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Kovyor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.grab canvas { cursor: grabbing; }
  body.over canvas { cursor: grab; }
  #esc { position: fixed; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
         pointer-events: none; opacity: 0; transition: opacity .15s; display: grid; place-items: center;
         background: conic-gradient(#e8e2d6 calc(var(--k, 0) * 360deg), rgba(20,20,20,.55) 0); }
  #esc::after { content: 'Esc'; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
         background: rgba(15,15,15,.85); color: #e8e2d6; font: 600 13px system-ui, sans-serif; }
  canvas { transition: opacity .35s; }
  body.gone canvas { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="esc"></div>
<script src="renderer.js"></script>
</body>
</html>
