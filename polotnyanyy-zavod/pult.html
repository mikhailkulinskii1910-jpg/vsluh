<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пульт — Полотняный Завод</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b0b;color:#f4efe6;font-family:system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px}
h1{font-size:20px;font-weight:normal;text-align:center;margin:0}
button{font:inherit;font-size:22px;padding:28px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:#1d1d1d;color:#f4efe6;cursor:pointer}
button:active{background:#333}
#status{text-align:center;font-size:15px;color:#aaa;min-height:20px}
</style></head>
<body>
<h1>Пульт</h1>
<button id="show">Показать фото</button>
<button id="hide">Вернуть презентацию</button>
<div id="status"></div>
<script>
var TOPIC="mog-xq_EFIHy3FarBH2KpJFJEw";
function send(cmd){
  var s=document.getElementById('status');
  fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:cmd})
    .then(function(r){s.textContent=r.ok?'Отправлено':'Ошибка: '+r.status})
    .catch(function(){s.textContent='Нет связи'});
}
document.getElementById('show').onclick=function(){send('show')};
document.getElementById('hide').onclick=function(){send('hide')};
</script>
</body></html>
