plugins { id 'com.android.application' }

android {
    namespace 'ru.vsluh.fly'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.vsluh.fly'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // Подпись: ключ и пароли берутся из keystore.properties (в git не попадает).
    // Если файла нет, APK подписывается отладочным ключом этой машины.
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
