name: Kovyor (Windows)

on:
  push:
    paths: ["kovyor/**", ".github/workflows/kovyor.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kovyor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win portable nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kovyor-windows
          path: |
            kovyor/dist/*.exe
