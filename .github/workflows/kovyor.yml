name: Kovyor (Windows)

on:
  push:
    paths: ["kovyor/**", ".github/workflows/kovyor.yml", "!kovyor/release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kovyor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kovyor-windows
          path: kovyor/dist/*.exe
      # готовые файлы кладём в репозиторий, чтобы была прямая ссылка на скачивание
      - name: Commit release
        shell: bash
        run: |
          mkdir -p release
          cp dist/Kovyor-Setup.exe dist/Kovyor-portable.exe release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git diff --cached --quiet && exit 0
          git commit -m "Kovyor: сборка для Windows ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
