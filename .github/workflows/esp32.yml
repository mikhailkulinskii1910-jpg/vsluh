name: ESP32 krisa37 HID

on:
  push:
    paths: ["firmware/**", ".github/workflows/esp32.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli and ESP32 core
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/arduino-cli config init
          $HOME/bin/arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          $HOME/bin/arduino-cli core update-index
          $HOME/bin/arduino-cli core install esp32:esp32@3.0.7
      - name: Build (ESP32-S3 SuperMini, USB-OTG TinyUSB, 4 MB)
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,FlashSize=4M,PartitionScheme=default" \
            --export-binaries --output-dir out firmware/krisa37-hid
          ls -la out
          cp out/krisa37-hid.ino.merged.bin krisa37-hid.bin
      - name: Build diagnostic variant (no HID, log over USB serial)
        run: |
          mkdir -p diag/krisa37-hid-diag
          cp firmware/krisa37-hid/types.h diag/krisa37-hid-diag/
          { echo '#define KRISA_DIAG'; cat firmware/krisa37-hid/krisa37-hid.ino; } > diag/krisa37-hid-diag/krisa37-hid-diag.ino
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default" \
            --export-binaries --output-dir out-diag diag/krisa37-hid-diag
          cp out-diag/krisa37-hid-diag.ino.merged.bin krisa37-hid-diag.bin
      - name: Build ESP32-C3 variant (Bluetooth keyboard/mouse)
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default" \
            --export-binaries --output-dir out-c3 firmware/krisa37-hid-c3
          cp out-c3/krisa37-hid-c3.ino.merged.bin krisa37-hid-c3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: krisa37-hid
          path: |
            krisa37-hid.bin
            krisa37-hid-diag.bin
            krisa37-hid-c3.bin
