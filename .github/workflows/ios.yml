name: iOS krisa

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project Krisa.xcodeproj -scheme Krisa -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcbeautify || exit ${PIPESTATUS[0]}
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/krisa.app out/Payload/
          (cd out && zip -qr krisa.ipa Payload && rm -rf Payload)
          ls -la out

      - name: Simulator screenshots
        run: |
          xcodebuild -project Krisa.xcodeproj -scheme Krisa -configuration Debug \
            -sdk iphonesimulator -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | xcbeautify || exit ${PIPESTATUS[0]}
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in d for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/krisa.app
          # кадры заставки: приложение останавливает её на заданном моменте (KRISA_SPLASH_AT)
          for at in 400 1000 1400 2000 2500; do
            SIMCTL_CHILD_KRISA_SPLASH_AT=$at xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
            sleep 4; xcrun simctl io "$DEV" screenshot "out/splash-$at.png"
          done
          SIMCTL_CHILD_KRISA_OPEN_HELP=1 xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          sleep 6; xcrun simctl io "$DEV" screenshot "out/splash-help.png"
          xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          for t in 0.4 0.8 1.0 3.0; do sleep $t; xcrun simctl io "$DEV" screenshot "out/shot-$(date +%s%N).png"; done
          # тема «Призма»
          xcrun simctl terminate "$DEV" ru.irbis.krisa || true
          xcrun simctl spawn "$DEV" defaults write ru.irbis.krisa theme prism
          SIMCTL_CHILD_KRISA_SPLASH_AT=2000 xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          sleep 4; xcrun simctl io "$DEV" screenshot "out/splash-prism.png"
          xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          sleep 5; xcrun simctl io "$DEV" screenshot "out/shot-prism.png"
          # тема «Тепловизор»
          xcrun simctl terminate "$DEV" ru.irbis.krisa || true
          xcrun simctl spawn "$DEV" defaults write ru.irbis.krisa theme thermal
          SIMCTL_CHILD_KRISA_SPLASH_AT=2000 xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          sleep 4; xcrun simctl io "$DEV" screenshot "out/splash-thermal.png"
          xcrun simctl launch --terminate-running-process "$DEV" ru.irbis.krisa
          sleep 5; xcrun simctl io "$DEV" screenshot "out/shot-thermal.png"
          # уменьшенные кадры — в лог, чтобы их можно было посмотреть без скачивания артефактов
          for f in out/shot-*.png out/splash-*.png; do
            sips -Z 360 -s format jpeg -s formatOptions 55 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== SHOT $(basename "$f") ==="; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: krisa-ios
          path: |
            ios/out/krisa.ipa
            ios/out/shot-*.png
            ios/out/splash-*.png
