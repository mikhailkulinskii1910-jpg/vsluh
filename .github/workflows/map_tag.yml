name: Map Tag APK

on:
  push:
    paths: ["map_tag/**", ".github/workflows/map_tag.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map_tag/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: map-tag-apk
          path: map_tag/android/app/build/outputs/apk/release/app-release.apk
